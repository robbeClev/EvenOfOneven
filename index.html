<!DOCTYPE html>
<html>
    <head>
        <title>W3.CSS</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta charset="UTF-8">

        <link rel="stylesheet" href="https://www.w3schools.com/w3css/6/w3.css">
        <link rel="stylesheet" href="style.css">

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    </head>
<body class="w3-content">
 
    <header class="w3-bar w3-orange">
        <p class="w3-bar-item">Even en Oneven</p>
    </header>

    <div class="w3-container">
        <h1 class="w3-large">Even en Oneven</h1>
        <h2 class="w3-medium w3-text-grey">We gebruiken W3.CSS om deze app op te maken en we gebruiken JQuery om een getal te beoordelen of het even of oneven is</h2>
    </div>

    <div class="w3-bar w3-orange">
        <p class="w3-bar-item">Deze app berekent of een gegeven getal even of oneven is.</p>
    </div>

    <div class="w3-container">
        <label>Geef getal</label>
        <input id="invoer" class="w3-input" type="text">
        <button id="knop" class="w3-button w3-orange w3-margin w3-center">Even of Oneven?</button>
        <p id="uitvoer" class="w3-large">Geef getal en druk op de knop.</p>
    </div>


    <footer class="w3-bottom w3-bar w3-pink">
        <p class="w3-bar-item w3-center">© 2023 by Robbe Clevers</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
